name: Auto Blog Post from Issue

on:
  issues:
    types: [opened]

jobs:
  create-blog-post:
    if: contains(github.event.issue.title, 'Auto Blog Post')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Extract content and create post
        run: |
          # Issue 본문에서 마크다운 추출
          echo "${{ github.event.issue.body }}" > "_posts/$(date +%Y-%m-%d)-weekly-portfolio-analysis.md"
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Auto-generated blog post"
          git push
      - name: Close issue
        run: |
          gh issue close ${{ github.event.issue.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
