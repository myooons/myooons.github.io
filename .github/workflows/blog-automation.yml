name: Blog Post Automation

on:
  issues:
    types: [opened]

jobs:
  create-blog-post:
    if: contains(github.event.issue.title, '📈 Weekly Portfolio Analysis')
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Extract JSON from issue
      id: extract-json
      run: |
        # GitHub Issue 본문에서 JSON 추출
        echo '${{ github.event.issue.body }}' > issue_body.txt
        
        # JSON 블록 추출 (```json과 ``` 사이의 내용)
        sed -n '/```json/,/```/p' issue_body.txt | sed '1d;$d' > blog_data.json
        
        # JSON에서 데이터 추출
        TITLE=$(jq -r '.title' blog_data.json)
        DATE=$(jq -r '.date' blog_data.json)
        CONTENT=$(jq -r '.content' blog_data.json)
        CATEGORIES=$(jq -r '.categories | join(", ")' blog_data.json)
        TAGS=$(jq -r '.tags | join(", ")' blog_data.json)
        
        # 파일명 생성
        FILENAME="${DATE}-weekly-portfolio-analysis.md"
        
        # 환경 변수로 설정
        echo "TITLE=${TITLE}" >> $GITHUB_ENV
        echo "DATE=${DATE}" >> $GITHUB_ENV
        echo "CONTENT=${CONTENT}" >> $GITHUB_ENV
        echo "CATEGORIES=${CATEGORIES}" >> $GITHUB_ENV
        echo "TAGS=${TAGS}" >> $GITHUB_ENV
        echo "FILENAME=${FILENAME}" >> $GITHUB_ENV

    - name: Create markdown blog post
      run: |
        # _posts 디렉토리 생성 (없으면)
        mkdir -p _posts
        
        # Jekyll Front Matter와 함께 마크다운 파일 생성
        cat > "_posts/${FILENAME}" << EOF
        ---
        layout: post
        title: "${TITLE}"
        date: ${DATE} 09:30:00 +0900
        categories: [${CATEGORIES}]
        tags: [${TAGS}]
        author: AI Portfolio Manager
        description: "AI-driven micro-cap stock analysis and investment strategy report"
        image: /assets/img/portfolio-analysis.jpg
        ---
        
        ${CONTENT}
        
        ---
        
        **Disclaimer:** This analysis is generated by AI and should not be considered as financial advice. Always conduct your own research before making investment decisions.
        
        **Contact:** For questions about this analysis, please contact kimys824@naver.com
        EOF

    - name: Commit and push blog post
      run: |
        # Git 설정
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 변경사항 커밋
        git add "_posts/${FILENAME}"
        git commit -m "📈 Add weekly portfolio analysis - $(date +'%Y-%m-%d')"
        git push

    - name: Close issue with success comment
      uses: actions/github-script@v7
      with:
        script: |
          const blogUrl = `https://${{ github.repository_owner }}.github.io/${process.env.DATE.replace(/-/g, '/')}/weekly-portfolio-analysis.html`;
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `✅ **Blog post successfully created!**
            
            📝 **File:** \`_posts/${process.env.FILENAME}\`
            🔗 **Live URL:** ${blogUrl}
            ⏰ **Created:** ${new Date().toISOString()}
            
            The Jekyll site will rebuild automatically. Your blog post will be live in a few minutes! 🎉`
          });
          
          await github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            state: 'closed',
            labels: ['automated', 'blog-post', 'completed']
          });
