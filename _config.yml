# =================================
#  myooons.github.io — _config.yml
# =================================

name: "myooons"
description: "매주 수요일, AI가 분석하는 주간 종목 추천 & 투자 인사이트"

author:
  github:    myooons
  email:     kimys824@naver.com

copyright:
  year: 2025
  name: myooons

# Google Analytics
google-analytics:
  id: ""

# Disqus
disqus:
  id: ""

# URL — 본인 주소로 변경하세요
url: "https://myooons.github.io"
baseurl: ""

timezone: Asia/Seoul
permalink: /:year-:month-:day/:title/

# Pagination
paginate: 8
paginate_path: /page:num/

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Navigation
nav:
  - name: "Home"
    url: "/"
  - name: "Archive"
    url: "/archive"
  - name: "Tags"
    url: "/tags"
  - name: "About"
    url: "/about"
  - name: "Resume"
    url: "/resume"
  - name: "GitHub"
    url: "https://github.com/myooons"

# Sass
sass:
  sass_dir: _sass
  style: :compressed

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

plugins:
  - jekyll-seo-tag
  - jekyll-paginate

exclude:
  - vendor
  - Gemfile
  - Gemfile.lock
  - README.md
